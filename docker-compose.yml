# ============================================
# CreditWise - Docker Compose
# Explainable Alternative Credit Scoring System
# ============================================

version: "3.9"

services:
  # -------------------------------------------
  # Backend: FastAPI + ML Model + LLM Explainability
  # -------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditwise-backend
    ports:
      - "8000:8000"
    environment:
      # Explanation provider: "local" or "openai"
      - EXPLANATION_PROVIDER=${EXPLANATION_PROVIDER:-openai}
      # For local LLM on host machine, use host.docker.internal
      # For OpenAI cloud, use https://api.openai.com/v1
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:20128/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-oc/deepseek-v4-flash-free}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EXPLANATION_LANGUAGE=${EXPLANATION_LANGUAGE:-fa}
    volumes:
      # Persist ML models
      - backend_models:/app/models
      # Persist generated data
      - backend_data:/app/data
    # Allow access to host machine's LLM server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - creditwise-network

  # -------------------------------------------
  # Frontend: React + Vite + Tailwind CSS
  # -------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditwise-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - creditwise-network

# -------------------------------------------
# Volumes for persistence
# -------------------------------------------
volumes:
  backend_models:
    driver: local
  backend_data:
    driver: local

# -------------------------------------------
# Network
# -------------------------------------------
networks:
  creditwise-network:
    driver: bridge